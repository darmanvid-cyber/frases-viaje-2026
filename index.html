<style>

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function sub(s){return s.replace(/\[(\w+)\]/g,(m,k)=>fills[k]||m)}
function copy(text){
  const ok=()=>toast("Copiado");
  const fb=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.append(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){toast("No se pudo copiar")}ta.remove()};

function speak(text,lang){
  if(!window.speechSynthesis){toast("Sin voz en este dispositivo");return}

function phraseCard(label,es,en){

function render(){
  main.replaceChildren();
  const q=$("#q").value.trim().toLowerCase();
  if(q){
    let n=0;
    GROUPS.forEach(g=>g.i.forEach(([l,es,en])=>{if((l+es+en+g.t).toLowerCase().includes(q)){n++;main.append(phraseCard(g.t+" · "+l,es,en))}}));
    CITIES.forEach(x=>{if((x.c+x.h+x.a+x.buy+x.say[0]+x.say[1]).toLowerCase().includes(q)){n++;main.append(cityCard(x))}});
    if(!n)main.append(el("p","note","No hay frases con esa palabra. Prueba con otra o toca una pestaña."));
    return;
  }
  if(cur==="viaje"){itinerary();return}
  if(cur==="ruta"){
    main.append(el("p","note","Una tarjeta por ciudad: hotel, cómo llegar a la estación y qué decir para comprar el siguiente trayecto. Las fechas son las del itinerario actual."));
    CITIES.forEach(x=>main.append(cityCard(x)));
    main.append(el("p","note","Direcciones de referencia del hotel más económico de cada ciudad (octubre 2026). Confirma la dirección exacta al reservar."));
    return;
  }
  const g=GROUPS.find(g=>g.id===cur);
  main.append(el("h2",null,g.t));main.append(el("p","note",g.s));
  if(g.sos){main.append(sosBlock())}
  if(g.tip){const t=el("div","card");t.append(el("div","lbl","Recomendado"),el("p","es",g.tip));main.append(t)}
  g.i.forEach(([l,es,en])=>main.append(phraseCard(l,es,en)));
}

function sceneEl(k,tag,date){
  const S=SCENES[k],d=el("div","scene");d.style.background=S.sky;

  if(S.stars){d.append(el("div","stars"))}
