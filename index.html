function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function sub(s){return s.replace(/\[(\w+)\]/g,(m,k)=>fills[k]||m)}
function copy(text){
  const ok=()=>toast("Copiado");
  const fb=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.append(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){toast("No se pudo copiar")}ta.remove()};

function speak(text,lang){

function btn(label,fn,main){const b=el("button","btn"+(main?" main":""),label);b.type="button";b.onclick=fn;return b}

function phraseCard(label,es,en){
  const c=el("div","card");
  c.append(el("div","lbl",label));
  const e=el("p","es"),n=el("p","en");
  const keys=[...new Set((en.match(/\[(\w+)\]/g)||[]).map(m=>m.slice(1,-1)))];
  const paint=()=>{e.textContent=sub(es);n.textContent=sub(en)};
  paint();
  c.append(e,n);
  keys.forEach(k=>{
    const f=el("div","fill"),inp=document.createElement("input");
    inp.id="fill-"+k+"-"+Math.random().toString(36).slice(2,6);inp.placeholder="Escribe: "+k;inp.value=fills[k]||"";inp.setAttribute("aria-label",k);

  });

function render(){

  const g=GROUPS.find(g=>g.id===cur);
  main.append(el("h2",null,g.t));main.append(el("p","note",g.s));
  if(g.sos){main.append(sosBlock())}
  if(g.tip){const t=el("div","card");t.append(el("div","lbl","Recomendado"),el("p","es",g.tip));main.append(t)}
  g.i.forEach(([l,es,en])=>main.append(phraseCard(l,es,en)));
}
const DIRS=[
["Spanish","English","Español → Inglés (lo que quiero decir)","en-US"],
["English","Spanish","Inglés → Español (entender lo que me escriben)","es-ES"],
["Spanish","Norwegian (Bokmål)","Español → Noruego","nb-NO"],
["Spanish","Swedish","Español → Sueco","sv-SE"],
["Spanish","Danish","Español → Danés","da-DK"]];
const LC={"English":"en","Spanish":"es","Norwegian (Bokmål)":"no","Swedish":"sv","Danish":"da"};
async function mm(text,d){
  const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair="+LC[d[0]]+"|"+LC[d[1]]);
  const j=await r.json();
  const t=j&&j.responseData&&j.responseData.translatedText;
  if(!t||j.responseStatus!=200)throw new Error("mm");
  const e=document.createElement("textarea");e.innerHTML=t;return e.value;
}
const tr={dir:0,src:"",out:"",busy:false,err:""};
function translatorView(){
  const d=DIRS[tr.dir];
  const c=el("div","card");
  c.append(el("div","lbl","Traductor"));
  c.append(el("p","note","Escribe lo que quieres decir y tradúcelo. Con Mostrar se lo enseñas a la otra persona; con Escuchar suena en voz alta. Necesita internet."));
  const sel=document.createElement("select");sel.id="tr-dir";sel.setAttribute("aria-label","Idiomas");
  DIRS.forEach((x,i)=>{const o=el("option",null,x[2]);o.value=i;sel.append(o)});sel.value=tr.dir;
  sel.onchange=()=>{tr.dir=+sel.value;tr.out="";tr.err="";render()};
  const ta=document.createElement("textarea");ta.id="tr-src";ta.rows=4;ta.value=tr.src;
  ta.placeholder=tr.dir===1?"Pega o escribe el texto en inglés…":"Escribe en español lo que quieres decir…";
  ta.oninput=()=>{tr.src=ta.value};
  c.append(sel,ta);
  const r=el("div","row");
  const go=btn(tr.busy?"Traduciendo…":"Traducir",async()=>{
    const text=ta.value.trim();if(!text||tr.busy)return;
    const sample=window.claude&&await window.claude.use("sample");
    tr.busy=true;tr.err="";tr.out="";render();
    try{
      const res=sample?await sample("Translate the text between the markers from "+d[0]+" to "+d[1]+". Use natural, polite, short everyday wording for a tourist talking to hotel, train, restaurant or tour staff. Reply with ONLY the translation, no quotes or notes.\n\n<<<\n"+text+"\n>>>",{modelTier:"quick"});:{text:await mm(text,d)};
      tr.out=(res.text||"").trim();
    }catch(e){
      tr.err=e&&e.code==="not_granted"?"Falta el permiso para traducir. Vuelve a tocar Traducir y acepta.":e&&e.code==="rate_limited"?"Demasiadas traducciones seguidas. Espera un momento.":"No se pudo traducir. Revisa la conexión e intenta de nuevo.";
    }
    tr.busy=false;render();
  },true);
  go.disabled=tr.busy;
  r.append(go,btn("Borrar",()=>{tr.src="";tr.out="";tr.err="";render()}));
  c.append(r);
  main.append(c);
  if(tr.err){const e=el("p","note",tr.err);e.style.color="var(--warn)";e.setAttribute("role","alert");main.append(e)}
  if(tr.out){
    const o=el("div","card");
    o.append(el("div","lbl",d[1]),el("p","en",tr.out));
    const rr=el("div","row");
    rr.append(btn("Mostrar",()=>show(tr.out,tr.src,null,d[3]),true),btn("Escuchar",()=>speak(tr.out,d[3])),btn("Copiar",()=>copy(tr.out)));
    o.append(rr);main.append(o);
  }
}
function renderTabs(){
  tabsEl.replaceChildren();
  TABS.forEach(t=>{
    const b=el("button","tab",t.t);b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",String(t.id===cur&&!$("#q").value));
    b.onclick=()=>{cur=t.id;$("#q").value="";try{localStorage.setItem("fv-tab",cur)}catch(e){}renderTabs();render();scrollTo(0,0)};
    tabsEl.append(b);
  });
}
$("#q").addEventListener("input",()=>{renderTabs();render()});
renderTabs();render();
</script>
